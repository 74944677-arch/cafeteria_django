{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Sistema de Cafetería
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link
        rel="stylesheet"
        href="{% static 'css/base.css' %}"
    >

</head>

<body>


<!-- =====================================================
     BARRA DE NAVEGACIÓN
     Solo aparece si existe un usuario autenticado.
====================================================== -->

{% if user.is_authenticated %}

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <!-- Enlace al módulo principal -->
        <a
            class="navbar-brand"
            href="{% url 'inicio' %}"
        >
            Cafetería
        </a>


        <div class="d-flex align-items-center gap-2">

            <!-- Usuario actualmente autenticado -->
            <span class="text-white">
                Usuario: {{ user.username }}
            </span>


            <!-- =================================================
                 OPCIONES SOLO PARA ADMINISTRADORES
            ================================================== -->

            {% if user.is_staff %}

            <a
                href="{% url 'admin:index' %}"
                class="btn btn-warning btn-sm"
            >
                Administración
            </a>

            {% endif %}


            <!-- =================================================
                 CERRAR SESIÓN
                 Se utiliza POST por seguridad.
            ================================================== -->

            <form
                method="post"
                action="{% url 'logout' %}"
                class="d-inline"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-outline-light btn-sm"
                >
                    Cerrar sesión
                </button>

            </form>

        </div>

    </div>

</nav>

{% endif %}


<!-- =====================================================
     CONTENIDO DE CADA PÁGINA
====================================================== -->

<div class="container mt-4">

    {% block content %}

    {% endblock %}

</div>


</body>

</html>
